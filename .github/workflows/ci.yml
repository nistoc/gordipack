name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Скрипты и hooks пакета живут на Windows (hooks — PowerShell), поэтому Windows — обязательно.
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    env:
      # Вывод pytest и скриптов — по-русски; без этого лог Windows-раннера печатает \uXXXX.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: pytest (contracts of schema, init-group, hooks, scripts)
        run: python -m pytest tests

      - name: turn-status plugin tests
        run: node plugins/turn-status/test/run.js
